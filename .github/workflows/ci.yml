name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the suite
        run: python -m unittest discover -s tests -t . -v

  lint:
    name: Skills and commands lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python tools/lint_skills.py

  guards:
    name: Personal-data and permission guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/security_guards.py

  latex:
    name: Templates compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install a minimal TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
      - name: Compile the shipped skeletons
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          cp templates/preamble.tex "$work/"
          for file in statement cover_letter; do
            cp "templates/$file.tex" "$work/"
            (cd "$work" && pdflatex -interaction=nonstopmode -halt-on-error "$file.tex" >/dev/null \
                        && pdflatex -interaction=nonstopmode -halt-on-error "$file.tex" >/dev/null)
            test -s "$work/$file.pdf" || { echo "$file.tex produced no PDF"; exit 1; }
            echo "$file.tex compiled"
          done
